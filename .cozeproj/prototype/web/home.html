<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>枫 · Now is the time</title>

  <link href="https://lf-code-agent.coze.cn/obj/x-ai-cn/fonts/google/google-all-fonts.css" rel="stylesheet"/>

  <script src="https://lf-code-agent.coze.cn/obj/x-ai-cn/cdn/jquery/jquery-3.7.1.min.js"></script>
  <script src="https://lf-code-agent.coze.cn/obj/x-ai-cn/cdn/lucide/lucide-1.11.0.min.js"></script>
  <script src="https://lf-code-agent.coze.cn/obj/x-ai-cn/cdn/tailwindcss/tailwindcss-browser-4.2.4.min.js"></script>

  <style type="text/tailwindcss">
    @theme {
      /* === 品牌色（苔藓绿：数字花园的生长与沉淀意象） === */
      --color-primary:              #3F6B50;
      --color-primary-container:    #DEEBDD;
      --color-on-primary:           #ffffff;
      /* === 背景 / 表面（暖纸白书桌） === */
      --color-background:                 #FAF9F5;
      --color-surface-container-lowest:   #FFFFFF;
      --color-surface:                    #FFFFFF;
      --color-surface-container:          #F1EFE9;
      --color-surface-container-high:     #EAE7DF;
      --color-surface-container-highest:  #E0DCD1;
      /* === 文字（暖墨黑 / 暖灰） === */
      --color-on-surface:           #26251F;
      --color-on-surface-variant:   #6E6A5E;
      /* === 功能色 === */
      --color-success:  #22c55e;
      --color-error:    #ef4444;
      --color-warning:  #f59e0b;
      /* === 边框 === */
      --color-outline:          #8A8577;
      --color-outline-variant:  #C9C5B8;
      /* === 圆角 === */
      --radius-sm:   0.375rem;
      --radius-md:   0.5rem;
      --radius-lg:   0.75rem;
      --radius-xl:   1rem;
      --radius-2xl:  1.25rem;
      --radius-full: 9999px;
      /* === 阴影（克制柔和，像纸张的轻微浮起） === */
      --shadow-card:   0 2px 12px rgba(38,37,31,0.08);
      --shadow-float:  0 10px 30px rgba(38,37,31,0.12);
      --shadow-dialog: 0 25px 60px rgba(38,37,31,0.22);
      /* === 字体：标题衬线（书香气质），正文常规 === */
      --font-sans: "Noto Sans SC", system-ui, sans-serif;
      --font-serif: "Noto Serif SC", "Noto Sans SC", serif;
    }
  </style>

  <!-- 入场动画：缓慢浮现，呼应"生长"意象 -->
  <style>
    @keyframes rise-in {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .rise-in { animation: rise-in 1.1s cubic-bezier(0.22, 1, 0.36, 1) both; }
    .rise-in-d1 { animation-delay: 0.15s; }
    .rise-in-d2 { animation-delay: 0.3s; }
    .rise-in-d3 { animation-delay: 0.45s; }

    /* 背景水印：「寻找」整版立体艺术字（letterpress 压印质感，代表不断的追寻与起点） */
    .wm-char {
      font-family: 'STLiti', 'LiSu', '隶书', 'Ma Shan Zheng', serif;
      font-weight: 400;
      font-size: min(52vh, 38vw);
      line-height: 1;
      color: rgba(38, 37, 31, 0.042);
      text-shadow:
        3px 4px 6px rgba(38, 37, 31, 0.055),
        1px 1px 2px rgba(38, 37, 31, 0.04),
        -1px -1px 1px rgba(255, 255, 255, 0.9);
    }
    /* 「找」带极淡苔藓绿，寓意生机、希望 */
    .wm-char-sprout { color: rgba(63, 107, 80, 0.05); }

    /* 生长枝条：枝干线稿缓缓描画，末端叶片随后抽出 */
    .grow-line {
      stroke-dasharray: 220;
      stroke-dashoffset: 220;
      animation: branch-grow 1.6s cubic-bezier(0.22, 1, 0.36, 1) 1s forwards;
    }
    .grow-leaf {
      opacity: 0;
      transform-box: fill-box;
      transform-origin: left center;
      transform: scale(0.6);
      animation: leaf-in 0.7s cubic-bezier(0.22, 1, 0.36, 1) 2.4s forwards;
    }
    @keyframes branch-grow { to { stroke-dashoffset: 0; } }
    @keyframes leaf-in { to { opacity: 1; transform: scale(1); } }

    @media (prefers-reduced-motion: reduce) {
      .rise-in { animation: none; }
      .grow-line { animation: none; stroke-dashoffset: 0; }
      .grow-leaf { animation: none; opacity: 1; transform: none; }
    }
  </style>

  <!-- 图片兜底 -->
  <script>
    document.addEventListener('error', function (e) {
      const img = e.target;
      if (img.tagName !== 'IMG' || img.dataset.fallback) return;
      img.dataset.fallback = '1';
      const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      const cat = img.getAttribute('data-category') || '其他';
      const alt = img.getAttribute('alt') || '';
      const label = esc(alt.length > 8 ? alt.slice(0, 8) + '…' : alt);
      const icons = { '人物': '👤', '自然风景': '🏞', '动物': '🐾', '建筑城市': '🏙', '运动体育': '⚽', '交通工具': '🚗', '食物': '🍽', '服饰时尚': '👗', '商业科技': '💼', '游戏娱乐': '🎮', '艺术': '🎨', '其他': '🖼' };
      const icon = icons[cat] || '🖼';
      const w = img.width || 400, h = img.height || 300;
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}"><rect width="100%" height="100%" fill="%23f3f4f6"/><text x="50%" y="45%" text-anchor="middle" font-size="${Math.min(w, h) * 0.18}" dominant-baseline="central">${icon}</text><text x="50%" y="68%" text-anchor="middle" font-size="${Math.min(w, h) * 0.07}" fill="%239ca3af" font-family="system-ui,sans-serif" dominant-baseline="central">${label}</text></svg>`;
      img.src = 'data:image/svg+xml,' + svg;
    }, true);
  </script>
</head>

<body class="bg-background text-on-surface font-sans min-h-screen flex flex-col">

  <!-- @nav:start 导航组件 -->
  <header class="sticky top-0 z-40 bg-background/95 backdrop-blur border-b border-outline-variant/15">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
      <a href="home.html" id="logo-link" class="flex items-baseline gap-3" aria-label="返回首页">
        <span class="font-serif font-bold text-xl text-on-surface">枫</span>
        <span class="hidden sm:inline text-[10px] tracking-[0.35em] text-on-surface-variant uppercase">Now is the time</span>
      </a>
      <nav class="flex items-center gap-6 sm:gap-8">
        <a href="home.html" aria-current="page" class="text-sm font-semibold text-on-surface transition-colors">首页</a>
        <a href="garden.html" class="text-sm text-on-surface-variant hover:text-on-surface transition-colors">数字花园</a>
        <a href="about.html" class="text-sm text-on-surface-variant hover:text-on-surface transition-colors">关于我</a>
        <a href="admin.html" class="text-sm text-on-surface-variant hover:text-on-surface transition-colors">后台管理</a>
      </nav>
    </div>
  </header>
  <!-- @nav:end 导航组件 -->

  <main class="flex-1 w-full max-w-6xl mx-auto px-4 sm:px-6">
    <!-- @main-content:start -->

    <!-- ============ 区块：首屏标语（极简居中 + 印章/水印/生长枝条点缀） ============ -->
    <section id="hero-section" class="relative min-h-[calc(100vh-4rem)] flex flex-col items-center justify-center text-center py-16 overflow-hidden">
      <!-- 背景水印：「寻找」整版立体艺术字（letterpress 压印质感，对角错落铺满全屏；「找」带极淡苔藓绿，寓意生机与起点） -->
      <div class="pointer-events-none absolute inset-0 overflow-hidden select-none" aria-hidden="true">
        <span class="wm-char absolute -left-[3%] -top-[8%] -rotate-2">寻</span>
        <span class="wm-char wm-char-sprout absolute -right-[4%] -bottom-[12%] rotate-2">找</span>
      </div>

      <!-- 左上角：站点属性小字 -->
      <p class="rise-in absolute left-0 top-10 text-xs tracking-[0.3em] text-on-surface-variant">个人站 · EST. 2025</p>
      <!-- 右上角：站点态度小字 -->
      <p class="rise-in rise-in-d1 absolute right-0 top-10 text-xs tracking-[0.2em] text-on-surface-variant">合则闲读，不合互祝安好</p>

      <!-- 中央：代号（带印章）+ 主题标语 -->
      <h1 class="rise-in rise-in-d1 relative inline-block font-serif font-bold text-on-surface text-[96px] sm:text-[136px] leading-none select-none transition-transform duration-500 hover:scale-[1.02] cursor-default">枫
        <!-- 朱印：苔藓绿方形小印，微倾 3°，像书画落款 -->
        <span class="absolute -right-7 bottom-1 sm:-right-10 sm:bottom-2 w-8 h-8 sm:w-10 sm:h-10 bg-primary text-on-primary rounded-sm flex items-center justify-center font-serif text-sm sm:text-base font-bold shadow-card rotate-3" title="枫之印">楓</span>
      </h1>
      <p class="rise-in rise-in-d2 font-serif italic text-2xl sm:text-3xl text-on-surface mt-10">Now is <span class="text-primary">the time</span>.</p>
      <p class="rise-in rise-in-d3 text-base sm:text-lg text-on-surface-variant mt-4 tracking-wide">趁年轻，去做你觉得有意义的事情。</p>

      <!-- 生长枝条：入场后细枝缓缓生长、末端抽出一片小叶 -->
      <svg class="rise-in rise-in-d3 mt-8 h-10 w-44 mx-auto" viewBox="0 0 176 40" fill="none" aria-hidden="true">
        <path class="grow-line text-primary/70" d="M8 34 C 44 32, 76 26, 100 16 S 136 8, 152 8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        <path class="grow-leaf text-primary/60" d="M100 16 c 6 -9 15 -11 24 -10 c -6 8 -15 11 -24 10 z" fill="currentColor"/>
      </svg>
    </section>

    <!-- @main-content:end -->
  </main>

  <!-- ============ 页脚 ============ -->
  <footer id="site-footer" class="border-t border-outline-variant/15">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 py-8 flex flex-col items-center gap-4">
      <div id="footer-social" class="flex items-center gap-2">
        <a href="mailto:hi@feng.example" id="link-email" class="w-9 h-9 inline-flex items-center justify-center rounded-full text-on-surface-variant hover:text-primary transition-colors" aria-label="发邮件给我">
          <i data-lucide="mail" class="w-4 h-4"></i>
        </a>
        <a href="#" id="link-github" data-social="GitHub" class="w-9 h-9 inline-flex items-center justify-center rounded-full text-on-surface-variant hover:text-primary transition-colors" aria-label="GitHub 主页">
          <i data-lucide="github" class="w-4 h-4"></i>
        </a>
        <a href="#" id="link-rss" data-social="RSS" class="w-9 h-9 inline-flex items-center justify-center rounded-full text-on-surface-variant hover:text-primary transition-colors" aria-label="RSS 订阅">
          <i data-lucide="rss" class="w-4 h-4"></i>
        </a>
      </div>
      <p class="text-xs tracking-[0.25em] text-on-surface-variant">© 2025 枫 · NOW IS THE TIME</p>
    </div>
  </footer>

  <script>
    lucide.createIcons();

    $(function () {

</body>
